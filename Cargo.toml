[package]
name = "bevy-test"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.18.1", features = ["jpeg", "mp3"]}
bevy_rapier3d = { version = "0.33.0", features = [ "simd-stable", "async-collider" ] }
rand = "*"

[profile.dev.package."*"]
opt-level = 3

[features]
dev = ["bevy/dynamic_linking", "bevy/debug", "bevy_rapier3d/debug-render-3d"]