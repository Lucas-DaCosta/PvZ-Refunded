[package]
name = "bevy-test"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.18.1", features = ["jpeg", "mp3", "experimental_bevy_ui_widgets"]}
bevy_rapier3d = { version = "0.33.0", features = [ "simd-stable", "async-collider" ] }
bevy_ui_text_input = "0.7.0"
rand = "*"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[profile.dev.package."*"]
opt-level = 3

[features]
dev = ["bevy/dynamic_linking", "bevy/debug", "bevy_rapier3d/debug-render-3d"]
